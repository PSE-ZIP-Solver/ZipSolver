[project]
name = "zipsolver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.0",
    "stable-baselines3==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==8.1.2",
    "ruff==0.14.6",
    "mypy==1.20.4",
    "httpx==0.30.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "offline_training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "offline_training/tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false