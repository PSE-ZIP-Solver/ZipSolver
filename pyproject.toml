[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zipsolver"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.139.2",
    "gymnasium==1.3.0",
    "httpx>=0.28.1",
    "numpy==2.5.0",
    "pytest==9.1.1",
    "stable-baselines3==2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
    "uvicorn[standard]>=0.51.0",
]

[tool.setuptools]
py-modules = ["run_api"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "offline_training*",
]
exclude = [
    "frontend*",
    "tests*",
    "logs*",
]