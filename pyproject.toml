[project]
name = "zipsolver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "gymnasium==1.3.0",
    "httpx>=0.28.1",
    "numpy==2.5.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.11",
    "pytesseract>=0.3.13",
    "pytest==9.1.1",
    "stable-baselines3==2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installs the project into the venv so `import backend` resolves from any working
# directory and under any invocation (pytest, `python -m`, VS Code, uvicorn).
packages = ["backend", "offline_training"]

[tool.pytest.ini_options]
# Makes `backend.*` and `offline_training.*` importable regardless of the directory
# pytest is invoked from, so `uv run pytest` behaves identically in CI and locally.
pythonpath = ["."]
testpaths = ["backend/tests", "offline_training/tests"]
python_files = ["test_*.py"]
markers = [
    "contract: pure DTO schema tests — no TestClient, no mocks, no I/O",
]
