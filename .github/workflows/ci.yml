name: CI

on:
  push:
    branches: [dev, main, "CI-CD", "**"]   # "**" = every branch, temporarily
  pull_request:
    branches: [dev, main]
  workflow_dispatch:                        # adds a "Run workflow" button in the UI
# Cancel superseded runs on the same ref — saves minutes during rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────── BACKEND: change detection ──────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'offline_training/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ────────────────────────── BACKEND: lint (non-blocking) ──────────────────────────
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← non-blocking while style is being established
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.14.6
      - name: Ruff lint
        run: ruff check backend offline_training
      - name: Ruff format check
        run: ruff format --check backend offline_training

  # ────────────────────────── BACKEND: typecheck (non-blocking) ──────────────────────────
  backend-typecheck:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← non-blocking until type coverage matures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy backend offline_training

  # ══════════════════════════ LAYER TESTS ══════════════════════════
  # Each layer is its own job so a failure pinpoints the layer.
  # `continue-on-error` per layer = the malleability switch:
  #   false → blocking (layer is mature)
  #   true  → non-blocking (layer still in active development)

  test-puzzle-logic:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false         # ← BLOCKING: puzzle logic is the mature core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Puzzle Logic unit tests
        run: pytest backend/tests/unit/puzzl_logic -v

  test-rl-components:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← non-blocking: RL layer in active development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: RL Component unit tests
        run: pytest backend/tests/unit/rl_components -v

  test-offline-training:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← non-blocking: training utilities evolving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Offline Training unit tests
        run: pytest offline_training/tests -v

  test-api:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← non-blocking: API layer not yet implemented on this branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: API tests (skips cleanly if none exist yet)
        run: pytest backend/tests/unit/api -v || echo "No API tests yet — layer pending."

  # ────────────────────── BACKEND: full-suite integration gate ──────────────────────
  # Runs the ENTIRE backend suite together — catches cross-layer/import-contract breakage
  # that per-layer jobs miss. Non-blocking now (suite has known stale imports), flip later.
  test-backend-integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← flip to false once import conventions are unified
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Full backend suite + coverage
        run: pytest backend/tests offline_training/tests --cov=backend --cov=offline_training --cov-report=term-missing

  # ══════════════════════════ FRONTEND ══════════════════════════
  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # ← non-blocking during active UI build-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false         # ← BLOCKING: a broken build is never acceptable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Type-check + production build
        working-directory: frontend
        run: npm run build

  # Placeholder for when Vitest lands — wired now so it's one uncomment away.
  # frontend-test:
  #   needs: changes
  #   if: needs.changes.outputs.frontend == 'true'
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
  #     - working-directory: frontend
  #       run: npm ci || npm install
  #     - working-directory: frontend
  #       run: npm run test -- --run

  # ────────────────────────── STATUS GATE ──────────────────────────
  # Single required check for branch protection. Only lists jobs that MUST pass;
  # add a layer's name here the moment you flip it to blocking.
  ci-gate:
    needs: [test-puzzle-logic, frontend-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          echo "puzzle-logic: ${{ needs.test-puzzle-logic.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          if [[ "${{ needs.test-puzzle-logic.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "::error::A required CI job failed."
            exit 1
          fi
          echo "All required checks passed."